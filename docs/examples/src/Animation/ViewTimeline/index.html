<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAAPI Engine - View Timeline Example</title>
    <link rel="stylesheet" href="../../../css/base.css">
    <link rel="stylesheet" href="../../../css/responsive.css">
    <link rel="stylesheet" href="../../../css/ui-components.css">
    <style>
        /* This example requires page scrolling; opt out of the
           global no-scroll / flex-centred stage from base.css.
           Only the root (html) scrolls so the document is the single
           scroll source ViewTimeline subjects attach to. */
        html {
            width: auto;
            height: auto;
            min-height: 100vh;
            overflow: auto;
        }
        body {
            width: auto;
            height: auto;
            min-height: 100vh;
            display: block;
            overflow: visible;
            /* Reserve space at the top for the fixed RESPONSIVE badge so
               it never overlaps the heading or scrolling cards. */
            padding-top: 44px;
        }
        /* Keep the badge fixed above the scroll area so it stays clearly
           visible at all times. */
        .example-badge {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
        }
    </style>
    <script src="../../../js/elm-motion.js"></script>
    <script src="index.js"></script>
</head>

<body>
    <div id="elm"></div>
    <script>
        var app = Elm.Animation.ViewTimeline.Main.init({
            node: document.getElementById('elm'),
            flags: { window: { width: window.innerWidth } }
        });
        ElmMotion.init(app.ports);
    </script>
</body>

</html>
