name: CI

on:
  push:
    branches:
      - main
      - Refactoring-Property-Baseline
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_js_companion:
    name: Build JS Companion
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Build JS companion
        run: npm run build

  run_tests:
    name: Run Elm and JS Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elm
            elm-stuff
            tests/elm-stuff
          key: ${{ runner.os }}-elm-${{ hashFiles('elm.json', 'tests/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Run Elm tests
        run: |
          for i in 1 2 3; do
            if npm run test:elm; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "::warning ::elm-test attempt $i failed (likely transient package download); retrying"
              sleep $((i * 10))
            fi
          done
          exit 1

      - name: Run JS tests
        run: npm run test:js

  validate_docs_examples:
    name: Validate Documentation Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elm
            docs/examples/elm-stuff
          key: ${{ runner.os }}-elm-docs-${{ hashFiles('docs/examples/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-docs-
            ${{ runner.os }}-elm-

      - name: Build documentation examples
        run: |
          for i in 1 2 3; do
            if npm run build:docs; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "::warning ::build:docs attempt $i failed (likely transient package download); retrying"
              sleep $((i * 10))
            fi
          done
          exit 1

  audit_dependencies:
    name: Audit Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      # Blocking gate: the published package must ship no known high/critical
      # advisories. The companion has zero runtime dependencies (the only
      # bundled third-party code is scroll-timeline-polyfill), so this guards
      # exactly what reaches consumers.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # Informational: surface dev/toolchain advisories without failing CI.
      # These affect the build environment only, never the published artifact.
      - name: Audit full dependency tree (informational)
        run: npm audit || true